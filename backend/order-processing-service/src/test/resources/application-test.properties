# =============================================================================
# Test profile — overrides application.properties for @SpringBootTest tests
# Uses H2 in-memory database so tests run without a real PostgreSQL instance
# =============================================================================

# H2 in-memory DataSource
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Recreate schema fresh for every test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Suppress SQL noise in test output
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.pravinmali.orderprocessing=INFO

# Keep the same tax rate as production default
app.order.tax-rate=18

# Disable SpringDoc during tests (not needed)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
