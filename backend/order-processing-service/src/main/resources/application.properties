# =============================================================================
# Application
# =============================================================================
spring.application.name=order-processing-service
server.port=${SERVER_PORT:8080}

# =============================================================================
# PostgreSQL DataSource
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_processing_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP — Spring Boot default)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT:30000}

# =============================================================================
# JPA / Hibernate
# =============================================================================
# update: applies schema changes without dropping data (safe for dev)
# validate: only checks schema matches entities (use in prod)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# =============================================================================
# Logging
# =============================================================================
logging.level.com.pravinmali.orderprocessing=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_LEVEL_SQL_BIND:TRACE}

# =============================================================================
# Async Thread Pool (for domain event listeners)
# =============================================================================
app.async.core-pool-size=${ASYNC_CORE_POOL_SIZE:2}
app.async.max-pool-size=${ASYNC_MAX_POOL_SIZE:5}
app.async.queue-capacity=${ASYNC_QUEUE_CAPACITY:100}
app.async.thread-name-prefix=${ASYNC_THREAD_PREFIX:order-event-}

# =============================================================================
# Business Rules
# =============================================================================
# Tax rate in percentage — defaults to 18% (Indian GST).
# Design decision: not a company specification. Configurable per environment.
app.order.tax-rate=${ORDER_TAX_RATE:18}

# =============================================================================
# SpringDoc / Swagger UI
# =============================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tryItOutEnabled=true
