version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: ${DB_NAME:-orderdb}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-orderdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend/order-processing-service
      dockerfile: Dockerfile
    container_name: order-processing-service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-orderdb}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ORDER_TAX_RATE: ${APP_ORDER_TAX_RATE:-18}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
